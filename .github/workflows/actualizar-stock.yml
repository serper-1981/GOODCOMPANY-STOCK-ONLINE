name: Actualizar stock Good Company
on:
  schedule:
    # Argentina UTC-3: cada 15 min desde 08:07 hasta 15:52, final a las 16:07.
    - cron: '7,22,37,52 11-18 * * 1-5'
    - cron: '7 19 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sincronizacion-stock
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validar horario Argentina
        id: horario
        env:
          TZ: America/Argentina/Buenos_Aires
        run: |
          HORA=$(date +%H%M)
          DIA=$(date +%u)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$DIA" -le 5 ] && [ "$HORA" -ge 0800 ] && [ "$HORA" -le 1630 ]; }; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Fuera de horario laboral, no se publica"
          fi
      - uses: actions/setup-node@v4
        if: steps.horario.outputs.allowed == 'true'
        with:
          node-version: '22'
          cache: npm
      - if: steps.horario.outputs.allowed == 'true'
        run: npm ci
      - if: steps.horario.outputs.allowed == 'true'
        run: npx playwright install --with-deps chromium
      - name: Sincronizar ADMIN y publicar catálogo verificado
        if: steps.horario.outputs.allowed == 'true'
        env:
          GC_ADMIN_EMAIL: ${{ secrets.GC_ADMIN_EMAIL }}
          GC_ADMIN_PASSWORD: ${{ secrets.GC_ADMIN_PASSWORD }}
          GC_EMAIL: ${{ secrets.GC_ADMIN_EMAIL }}
          GC_PASSWORD: ${{ secrets.GC_ADMIN_PASSWORD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/sync-and-publish.cjs
