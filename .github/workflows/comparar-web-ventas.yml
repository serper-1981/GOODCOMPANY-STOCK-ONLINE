name: Comparar web ventas Good Company
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: comparar-web-ventas
  cancel-in-progress: false
jobs:
  comparar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Comparar ADMIN MASTER con web ventas
        env:
          GC_ADMIN_EMAIL: ${{ secrets.GC_ADMIN_EMAIL }}
          GC_ADMIN_PASSWORD: ${{ secrets.GC_ADMIN_PASSWORD }}
          GC_EMAIL: ${{ secrets.GC_ADMIN_EMAIL }}
          GC_PASSWORD: ${{ secrets.GC_ADMIN_PASSWORD }}
        run: node scripts/compare-sales.cjs
      - name: Guardar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparacion-web-ventas
          path: report/comparacion.json
          retention-days: 7
